name: Balotta iOS - assign build 1801 to internal testers
on: workflow_dispatch
permissions: {}
concurrency: balotta-testflight-group
jobs:
  assign:
    if: github.ref == 'refs/heads/ops/testflight-balotta-1801'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Assign only Balotta build 1801 to the existing internal group
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { sign } from 'node:crypto';
          import { setTimeout as delay } from 'node:timers/promises';
          const host='https://api.appstoreconnect.apple.com';
          const app='6832101489';
          const group='6d7bcbb1-273c-48ee-9120-47da2d79fc66';
          const version='1801';
          const enc=(data)=>Buffer.from(JSON.stringify(data)).toString('base64url');
          function token(){
            const now=Math.floor(Date.now()/1000);
            const input=enc({alg:'ES256',kid:'SHK6U3T299',typ:'JWT'})+'.'+enc({iss:'8f57d241-76f9-4226-a912-f2ef24ac1a92',iat:now,exp:now+300,aud:'appstoreconnect-v1'});
            return input+'.'+sign('sha256',Buffer.from(input),{key:process.env.ASC_API_KEY_P8,dsaEncoding:'ieee-p1363'}).toString('base64url');
          }
          async function call(path,body){
            const response=await fetch(host+path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+token(),...(body?{'content-type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(20000)});
            if(!response.ok){const e=await response.json().catch(()=>({}));throw Error('Apple HTTP '+response.status+' '+(e.errors?.[0]?.code??''));}
            if(response.status!==204)return response.json();
          }
          const groupInfo=(await call('/v1/betaGroups/'+group+'?include=app')).data;
          assert.equal(groupInfo.attributes.name,'Balotta demo');
          assert.equal(groupInfo.attributes.isInternalGroup,true);
          assert.equal(groupInfo.relationships.app.data.id,app);
          const query=new URLSearchParams({'filter[app]':app,'filter[version]':version});
          let build;
          for(let i=0;i<38;i++){
            const matches=(await call('/v1/builds?'+query)).data;
            assert.ok(matches.length<=1,'More than one build matches');
            build=matches[0];
            if(build?.attributes.processingState==='VALID')break;
            if(['FAILED','INVALID'].includes(build?.attributes.processingState))throw Error('Apple build state '+build.attributes.processingState);
            if(i%4===0)console.log('Waiting for build '+version+' ('+(build?.attributes.processingState??'not listed')+')');
            await delay(20000);
          }
          assert.equal(build?.attributes.processingState,'VALID','Apple processing did not finish');
          assert.equal(build.attributes.expired,false);
          const path='/v1/builds/'+build.id+'/relationships/betaGroups';
          const assigned=async()=>(await call(path)).data.some(row=>row.id===group);
          if(!await assigned())await call('/v1/betaGroups/'+group+'/relationships/builds',{data:[{type:'builds',id:build.id}]});
          for(let i=0;i<5&&!await assigned();i++)await delay(2000);
          assert.ok(await assigned(),'Apple did not confirm the group relationship');
          console.log('Verified build '+version+' ('+build.id+') in the existing Balotta demo internal group.');
          JS
