<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facciamo Balotta · il percorso</title><style>
@font-face{font-family:Balotta;src:url('./BalottaInchiostro.ttf')}*{box-sizing:border-box}html,body{margin:0;background:#f0e2bd;color:#252923}body{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:36px;padding:24px;font-family:system-ui,sans-serif}aside{max-width:240px}h1{font:42px/1.1 Balotta, sans-serif;margin:0 0 18px}p{font-size:14px;line-height:1.5}nav{display:flex;flex-direction:column;gap:12px}button{font:17px Balotta,sans-serif;text-align:left;border:2px solid #252923;border-radius:7px 12px 5px 9px;background:#fff5dc;padding:12px;cursor:pointer;box-shadow:3px 4px #252923}button[aria-pressed=true]{background:#e9ed97;transform:rotate(-1deg)}.phone{width:408px;height:862px;flex-shrink:0;border:9px solid #252923;border-radius:37px;overflow:hidden;background:#fff5dc;box-shadow:12px 14px #d44935}.phone iframe{width:390px;height:844px;border:0;display:block}@media(max-width:720px){body{padding:0;display:block;background:#fff5dc}aside{max-width:none;padding:12px}h1{font-size:25px;margin:0 0 10px}aside p{display:none}nav{flex-direction:row;overflow:auto;gap:8px}button{font-size:13px;white-space:nowrap;padding:8px}.phone{width:100vw;height:calc(100dvh - 119px);border:0;border-radius:0;box-shadow:none}.phone iframe{width:100%;height:100%}}
</style></head><body><aside><h1>Facciamo<br>Balotta!</h1><p>Quattro momenti da provare. Profili e appuntamenti sono fittizi.</p><nav aria-label="Schermate della demo"><button data-scene="registration" aria-pressed="true">1 · Registrazione</button><button data-scene="app" aria-pressed="false">2 · Dentro l’app</button><button data-scene="match" aria-pressed="false">3 · Persona proposta</button><button data-scene="appointment" aria-pressed="false">4 · Appuntamento</button></nav><p>Disegni, inchiostro e interessi comuni. L’accesso social e il matching reale non sono ancora attivi.</p></aside><main class="phone"><iframe title="Facciamo Balotta, demo mobile interattiva" src="./index.html?demoScreen=registration"></iframe></main><script>document.querySelectorAll('button[data-scene]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('iframe').src='./index.html?demoScreen='+b.dataset.scene;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}))</script></body></html>
